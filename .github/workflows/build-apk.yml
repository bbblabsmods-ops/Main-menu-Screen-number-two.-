name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Add optional keys to the app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p app/src/main/assets
          printf '%s' "$GEMINI_API_KEY" > app/src/main/assets/gemini.txt
          printf '%s' "$TAVILY_API_KEY" > app/src/main/assets/tavily.txt
          printf '%s' "$GROQ_API_KEY" > app/src/main/assets/groq.txt

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
